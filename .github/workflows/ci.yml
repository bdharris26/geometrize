name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Lint
        run: python -m ruff check python tests

  test:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Verify native backend
        run: python -m geometrize_py doctor
      - name: Test
        run: python -m pytest tests/python

  wheel:
    name: Wheel smoke / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl).FullName
          python -m venv .wheel-venv
          & .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          & .\.wheel-venv\Scripts\python.exe -m geometrize_py doctor
          & .\.wheel-venv\Scripts\python.exe -c "from importlib.metadata import version; import geometrize_py; assert geometrize_py.__version__ == version('geometrize-py')"
      - name: Verify wheel licenses
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl).FullName
          python -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert any(name.endswith('/licenses/LICENSE') for name in names), names; assert any(name.endswith('/licenses/THIRD_PARTY_NOTICES.md') for name in names), names" $wheel

  browser:
    name: Browser smoke / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and browser test dependencies
        run: python -m pip install -e ".[dev,browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        run: python -m pytest tests/browser
