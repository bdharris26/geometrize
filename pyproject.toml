[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "geometrize-py"
dynamic = ["version"]
description = "Python-first image geometrization app backed by the native Geometrize core."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Sam Twidale" }]
maintainers = [{ name = "bdharris26" }]
keywords = ["geometrize", "image", "graphics", "svg", "generative-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
browser = ["playwright>=1.50"]

[project.scripts]
geometrize = "geometrize_py.cli:main"
geometrize-py = "geometrize_py.cli:main"

[project.urls]
Homepage = "https://github.com/bdharris26/geometrize"
Repository = "https://github.com/bdharris26/geometrize"
Issues = "https://github.com/bdharris26/geometrize/issues"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/geometrize_py"]
wheel.license-files = ["LICENSE", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/geometrize_py/__init__.py"

[tool.scikit-build.cmake]
version = ">=3.18"
source-dir = "."

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python", "tests"]
extend-exclude = ["lib/geometrize"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
