[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "geometrize-py"
version = "0.2.0"
description = "Minimal Python UI for Geometrize backed by the native C++ core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geometrize = "geometrize_py.cli:main"
geometrize-py = "geometrize_py.cli:main"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/geometrize_py"]

[tool.scikit-build.cmake]
version = ">=3.18"
source-dir = "."

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-q"
