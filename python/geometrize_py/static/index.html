<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geometrize</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="controls" aria-label="Render controls">
      <header class="brand">
        <img class="brand-mark" src="/static/logo.svg" alt="" width="40" height="40">
        <div class="brand-copy">
          <h1>Geometrize</h1>
          <p id="native-state">Checking core</p>
        </div>
      </header>

      <form id="run-form">
        <div class="input-actions">
          <label class="drop-zone" for="image-input">
          <input id="image-input" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,image/png,image/jpeg,image/webp,image/bmp,image/gif,image/tiff">
            <span id="file-label">Choose image</span>
            <span id="image-name">No image selected</span>
          </label>
          <button id="sample-button" class="secondary" type="button">Sample</button>
        </div>

        <fieldset class="project-files" aria-describedby="project-help">
          <legend>Project</legend>
          <input id="project-input" type="file" accept=".json,application/json" hidden>
          <div class="project-actions">
            <button id="load-project-button" class="secondary" type="button">Open project</button>
            <button id="save-project-button" class="secondary" type="button" disabled>Save project</button>
          </div>
          <p id="project-help">Project JSON restores the source, result, options, and run history.</p>
        </fieldset>

        <fieldset class="shape-grid">
          <legend>Shapes</legend>
          <label><input type="checkbox" name="shape" value="ellipse" checked><span class="shape-symbol ellipse-symbol"></span><span class="shape-name">Ellipse</span></label>
          <label><input type="checkbox" name="shape" value="rotated_rectangle" checked><span class="shape-symbol rotated-rectangle-symbol"></span><span class="shape-name">Rotated rectangle</span></label>
          <label><input type="checkbox" name="shape" value="triangle" checked><span class="shape-symbol triangle-symbol"></span><span class="shape-name">Triangle</span></label>
          <label><input type="checkbox" name="shape" value="circle"><span class="shape-symbol circle-symbol"></span><span class="shape-name">Circle</span></label>
          <label><input type="checkbox" name="shape" value="rectangle"><span class="shape-symbol rectangle-symbol"></span><span class="shape-name">Rectangle</span></label>
          <label><input type="checkbox" name="shape" value="line"><span class="shape-symbol line-symbol"></span><span class="shape-name">Line</span></label>
        </fieldset>

        <div class="field">
          <label for="steps" title="How many accepted primitives to add in this batch. Continue adds another batch to the current result.">Shapes to add <output id="steps-out">128</output></label>
          <input id="steps" name="steps" type="range" min="1" max="4096" value="128">
        </div>

        <div class="field two">
          <label>Alpha <input id="alpha" name="alpha" type="number" min="1" max="255" value="128"></label>
          <label>Seed <input id="seed" name="seed" type="number" min="0" max="2147483647" value="9001"></label>
        </div>

        <div class="field two">
          <label title="Candidate primitives tested for each accepted shape.">Candidates per shape <input id="shape-count" name="shape_count" type="number" min="1" max="512" value="64"></label>
          <label title="Random refinements tried for each candidate primitive.">Mutations per candidate <input id="mutations" name="mutations" type="number" min="1" max="2048" value="128"></label>
        </div>

        <div class="field">
          <label for="max-size" title="Longest source dimension used by the optimizer. Lower values run faster and retain smaller resumable sessions.">Working resolution <output id="max-size-out">1024</output></label>
          <div class="range-with-input">
            <input id="max-size" name="max_size" type="range" min="64" max="2048" step="64" value="1024">
            <input id="max-size-number" type="number" min="64" max="2048" step="64" value="1024" aria-label="Working resolution value">
          </div>
        </div>

        <div class="field">
          <label for="export-size" title="Longest dimension for PNG and SVG output. This does not increase optimizer memory use.">Export resolution <output id="export-size-out">1024</output></label>
          <div class="range-with-input">
            <input id="export-size" name="export_size" type="range" min="64" max="4096" step="64" value="1024">
            <input id="export-size-number" type="number" min="64" max="4096" step="64" value="1024" aria-label="Export resolution value">
          </div>
        </div>

        <div class="run-actions">
          <button id="run-button" type="submit">Run</button>
          <button id="pause-button" class="secondary" type="button" disabled>Pause</button>
        </div>
      </form>
    </aside>

    <main class="workspace">
      <section class="preview-wrap" aria-label="Image preview">
        <div class="preview-grid">
          <figure class="preview-panel">
            <figcaption><span>Source</span><span id="source-meta"></span></figcaption>
            <img id="source-preview" alt="">
          </figure>
          <figure class="preview-panel">
            <figcaption><span>Live result</span><span id="result-meta"></span></figcaption>
            <div class="result-stage">
              <canvas id="result-canvas" aria-label="Live result preview"></canvas>
              <img id="result-preview" alt="" aria-hidden="true">
            </div>
          </figure>
        </div>
      </section>

      <section class="telemetry-console" aria-label="Optimization telemetry">
        <div class="run-strip">
          <span id="telemetry-state">Idle</span>
          <span id="telemetry-acceptance" title="Attempts are optimizer steps. Some attempts can test candidates without accepting a new shape.">0 accepted / 0 attempts</span>
          <span id="telemetry-improvement">Score --</span>
          <span id="telemetry-duration">--</span>
        </div>
        <div id="batch-history" class="batch-history" aria-label="Completed shape batches"></div>
        <div class="telemetry-grid">
          <article class="telemetry-card">
            <header><span>Convergence</span><output id="telemetry-score">--</output></header>
            <svg id="score-graph" class="telemetry-graph" viewBox="0 0 360 120" role="img" aria-label="Convergence graph"></svg>
          </article>
          <article class="telemetry-card">
            <header><span>Primitive Mix</span><output id="telemetry-total">0</output></header>
            <div id="primitive-mix" class="primitive-mix"></div>
          </article>
          <article class="telemetry-card">
            <header><span>Score Impact</span><output id="telemetry-impact">--</output></header>
            <svg id="impact-graph" class="telemetry-graph" viewBox="0 0 360 120" role="img" aria-label="Score impact graph"></svg>
          </article>
        </div>
      </section>

      <footer class="statusbar">
        <div class="status-group">
          <span id="status" role="status" aria-live="polite">Ready</span>
          <span id="pipeline">0 shapes</span>
        </div>
        <span id="metrics"></span>
        <div class="downloads">
          <a id="download-png" aria-disabled="true">PNG</a>
          <a id="download-svg" aria-disabled="true">SVG</a>
          <a id="download-json" aria-disabled="true">Shapes JSON</a>
        </div>
      </footer>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
