<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geometrize</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="controls" aria-label="Render controls">
      <header class="brand">
        <img class="brand-mark" src="/static/logo.svg" alt="" width="40" height="40">
        <div class="brand-copy">
          <h1>Geometrize</h1>
          <p id="native-state">Checking core</p>
        </div>
      </header>

      <form id="run-form">
        <div class="input-actions">
          <label class="drop-zone" for="image-input">
            <input id="image-input" type="file" accept="image/*">
            <span id="file-label">Choose image</span>
          </label>
          <button id="sample-button" class="secondary" type="button">Sample</button>
        </div>

        <fieldset class="shape-grid">
          <legend>Shapes</legend>
          <label><input type="checkbox" name="shape" value="ellipse" checked><span class="shape-symbol ellipse-symbol"></span><span class="shape-name">Ellipse</span></label>
          <label><input type="checkbox" name="shape" value="rotated_rectangle" checked><span class="shape-symbol rotated-rectangle-symbol"></span><span class="shape-name">Rotated rectangle</span></label>
          <label><input type="checkbox" name="shape" value="triangle" checked><span class="shape-symbol triangle-symbol"></span><span class="shape-name">Triangle</span></label>
          <label><input type="checkbox" name="shape" value="circle"><span class="shape-symbol circle-symbol"></span><span class="shape-name">Circle</span></label>
          <label><input type="checkbox" name="shape" value="rectangle"><span class="shape-symbol rectangle-symbol"></span><span class="shape-name">Rectangle</span></label>
          <label><input type="checkbox" name="shape" value="line"><span class="shape-symbol line-symbol"></span><span class="shape-name">Line</span></label>
        </fieldset>

        <div class="field">
          <label for="steps">Steps <output id="steps-out">75</output></label>
          <input id="steps" name="steps" type="range" min="1" max="400" value="75">
        </div>

        <div class="field two">
          <label>Alpha <input id="alpha" name="alpha" type="number" min="1" max="255" value="128"></label>
          <label>Seed <input id="seed" name="seed" type="number" min="0" value="9001"></label>
        </div>

        <div class="field two">
          <label>Candidates <input id="shape-count" name="shape_count" type="number" min="1" max="500" value="50"></label>
          <label>Mutations <input id="mutations" name="mutations" type="number" min="1" max="1000" value="100"></label>
        </div>

        <div class="field">
          <label for="max-size">Max size <output id="max-size-out">1024</output></label>
          <div class="range-with-input">
            <input id="max-size" name="max_size" type="range" min="64" max="8192" step="64" value="1024">
            <input id="max-size-number" type="number" min="64" max="8192" step="64" value="1024" aria-label="Max size value">
          </div>
        </div>

        <button id="run-button" type="submit">Run</button>
      </form>
    </aside>

    <main class="workspace">
      <section class="preview-wrap" aria-label="Image preview">
        <div class="preview-grid">
          <figure>
            <figcaption><span>Source</span><span id="source-meta"></span></figcaption>
            <img id="source-preview" alt="">
          </figure>
          <figure>
            <figcaption><span>Result</span><span id="result-meta"></span></figcaption>
            <img id="result-preview" alt="">
          </figure>
        </div>
      </section>

      <footer class="statusbar">
        <div class="status-group">
          <span id="status">Ready</span>
          <span id="pipeline">0 shapes</span>
        </div>
        <span id="metrics"></span>
        <div class="downloads">
          <a id="download-png" aria-disabled="true">PNG</a>
          <a id="download-svg" aria-disabled="true">SVG</a>
          <a id="download-json" aria-disabled="true">JSON</a>
        </div>
      </footer>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
